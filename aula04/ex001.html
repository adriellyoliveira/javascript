<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Programa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Valley+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <style>
        body {
            background-color: rgb(110, 110, 167);
            color: rgb(238, 199, 73);
            font-family: "Valley Sans", sans-serif;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <h1>Olá, Mundo!</h1>
    <p>Já me livrei da maldição!</p>

    <script>
        alert("Minha primeira mensagem") //dispara alerta na tela do navegador com um aviso
        confirm("Está gostando de JS?")//dispara uma opção de confirmação com "Ok" ou "Cancelar".
        prompt("Qual é o seu nome?");//dispara uma interação com o usuário.
    </script>
</body>

</html>
