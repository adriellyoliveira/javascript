<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Programa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Valley+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <style>
        body {
            background-color: rgb(110, 110, 167);
            color: rgb(238, 199, 73);
            font-family: "Valley Sans", sans-serif;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <h1>Olá, Mundo!</h1>
    <p>Já me livrei da maldição!</p>

    <script>
       var n1 = parseFloat(prompt("Digite um número")) //String para número flutuante/real
       var n2 = parseFloat(prompt("Digite outro número")) //String para número flutuante/real
       var s = n1 + n2
       alert(`A soma entre ${n1} e ${n2} é igual a ${s}`)
       // (number + number) para adição
       // (string + string) também para concatenação
    </script>
</body>

</html>
