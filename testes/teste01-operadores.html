<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste 01 | Aula de Operadores</title>
</head>

<body>

    <script>
        let nota1 = parseFloat(prompt("Digite a nota da P1: "));
        let nota2 = parseFloat(prompt("Digite a nota da P2: "));

        let media = (nota1 + nota2) / 2;

        if (media >= 7) {
            document.write(`Sua nota é ${media}. Parabéns, você está aprovado!`);
        } else {
            document.write(`Sua nota é ${media}. Infelizmente você está reprovado!`)
            
        }
        
    </script>
</body>

</html>
